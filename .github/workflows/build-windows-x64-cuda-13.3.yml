name: Build latest TurboQuant for Windows x64 (CUDA 13.3)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: false
        default: feature/turboquant-kv-cache
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 with CUDA 13.3
    runs-on: windows-2022

    steps:
      - name: Check out latest TurboQuant source
        uses: actions/checkout@v6
        with:
          repository: TheTom/llama-cpp-turboquant
          ref: ${{ inputs.ref }}
          path: source

      - name: Install CUDA Toolkit 13.3
        uses: ./source/.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'

      - name: Install Ninja
        shell: cmd
        run: choco install ninja --yes --no-progress

      - name: Configure and build
        shell: cmd
        working-directory: source
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_EXAMPLES=OFF ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_TOOLS=ON ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            -DGGML_RPC=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Package binaries and CUDA runtime
        shell: pwsh
        working-directory: source
        run: |
          Copy-Item LICENSE build/bin/Release/
          git rev-parse HEAD | Set-Content build/bin/Release/SOURCE_COMMIT.txt
          git log -1 --format=%cI | Set-Content build/bin/Release/SOURCE_COMMIT_DATE.txt
          $dst = '.\build\bin\Release\'
          robocopy "${{ env.CUDA_PATH }}\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          robocopy "${{ env.CUDA_PATH }}\lib" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          robocopy "${{ env.CUDA_PATH }}\bin\x64" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          7z a llama-cpp-turboquant-windows-x64-cuda-13.3.zip .\build\bin\Release\*

      - name: Upload Windows x64 CUDA 13.3 artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-cpp-turboquant-windows-x64-cuda-13.3
          path: source/llama-cpp-turboquant-windows-x64-cuda-13.3.zip
          if-no-files-found: error
          retention-days: 30
